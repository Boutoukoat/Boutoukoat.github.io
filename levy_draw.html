<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Spherical Levy Flight (Geodesic Arcs)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif;}
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #00ffcc;
            font-family: monospace; background: rgba(0,0,0,0.7); padding: 8px; pointer-events: none;
            white-space: pre-line;
        }
    </style>
    <!-- Use Cloudflare CDNJS URLs to completely bypass jsdelivr network blocks -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>
<div id="info">Generating Prime Gap Path...</div>
<script>
    // 1. Prime Gap Generator
    function getPrimeGaps(count) {
        let primes = [];
        let num = 2;
        while (primes.length < count + 1) {
            let isPrime = true;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) { isPrime = false; break; }
            }
            if (isPrime) primes.push(num);
            num++;
        }
        let gaps = [];
        for (let i = 0; i < count; i++) gaps.push(primes[i+1] - primes[i]);
        return gaps;
    }

    // 2. Setup Scene Architecture
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 12, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // OrbitControls is globally exposed under THREE using this CDN style
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 3. Add Atmosphere & Base Sphere
    const sphereRadius = 8;
    const sphereGeo = new THREE.SphereGeometry(sphereRadius, 48, 48);
    const sphereMat = new THREE.MeshBasicMaterial({ 
        color: 0x111625, wireframe: true, transparent: true, opacity: 0.25 
    });
    const baseSphere = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(baseSphere);

    // 4. Pre-calculate Geodesic Flight Paths
    const stepCount = 300;
    const gaps = getPrimeGaps(stepCount);
    const stepScale = 0.03; 
    const segmentsPerStep = 20; 

    let currentPos = new THREE.Vector3(0, sphereRadius, 0); 
    let forwardDir = new THREE.Vector3(0, 0, 1);
    let normalDir  = new THREE.Vector3(0, 1, 0);

    const pathSegments = [];

    for (let i = 0; i < gaps.length; i++) {
        let stepLengthRad = gaps[i] * stepScale;
        let rightDir = new THREE.Vector3().crossVectors(normalDir, forwardDir).normalize();
        
        let startPos = currentPos.clone();
        
        let moveQuaternion = new THREE.Quaternion().setFromAxisAngle(rightDir, stepLengthRad);
        currentPos.applyQuaternion(moveQuaternion);
        forwardDir.applyQuaternion(moveQuaternion);
        normalDir.applyQuaternion(moveQuaternion);
        
        let endPos = currentPos.clone();

        for (let j = 0; j <= segmentsPerStep; j++) {
            let t = j / segmentsPerStep;
            let arcPoint = new THREE.Vector3().copy(startPos).slerp(endPos, t);
            pathSegments.push(arcPoint);
        }

        let turnAngle = THREE.Math.degToRad(-120); 
        let turnQuaternion = new THREE.Quaternion().setFromAxisAngle(normalDir, turnAngle);
        forwardDir.applyQuaternion(turnQuaternion);
    }

    // 5. Dynamic Buffer Setup for Drawing Animation
    const maxPoints = pathSegments.length;
    const positions = new Float32Array(maxPoints * 3);
    
    // Seed initial point
    positions[0] = pathSegments[0].x;
    positions[1] = pathSegments[0].y;
    positions[2] = pathSegments[0].z;

    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc });
    const flightPath = new THREE.Line(lineGeo, lineMat);
    scene.add(flightPath);

    const markerGeo = new THREE.SphereGeometry(0.12, 8, 8);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
    const marker = new THREE.Mesh(markerGeo, markerMat);
    scene.add(marker);

    // 6. Real-time Rendering Loop Tracker
    let drawIndex = 0;
    const speed = 2; 
    const infoElement = document.getElementById('info');

    function animate() {
        requestAnimationFrame(animate);

        if (drawIndex < maxPoints - 1) {
            for (let s = 0; s < speed; s++) {
                if (drawIndex >= maxPoints - 1) break;
                
                drawIndex++;
                const p = pathSegments[drawIndex];
                
                positions[drawIndex * 3]     = p.x;
                positions[drawIndex * 3 + 1] = p.y;
                positions[drawIndex * 3 + 2] = p.z;
            }
            
            lineGeo.attributes.position.needsUpdate = true;
            lineGeo.setDrawRange(0, drawIndex + 1);
            marker.position.copy(pathSegments[drawIndex]);
            
            let currentStepIdx = Math.floor(drawIndex / (segmentsPerStep + 1));
            if(currentStepIdx < gaps.length) {
                infoElement.innerText = `Flight Step: ${currentStepIdx + 1} / ${stepCount}\nPrime Gap: ${gaps[currentStepIdx]}`;
            }
        } else {
            infoElement.innerText = `Flight Complete!\nTotal Steps: ${stepCount}`;
            marker.visible = false;
        }

        baseSphere.rotation.y += 0.001;
        flightPath.rotation.y += 0.001;
        marker.rotation.y     += 0.001;

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
